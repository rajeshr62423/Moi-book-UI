<script>
(function(){
  try{
    var a=localStorage.getItem('imoibook-color-theme')||localStorage.getItem('imoibook-theme-color')||'original';
    document.documentElement.setAttribute('data-accent',a);
    var appearance=localStorage.getItem('imoibook-appearance')||localStorage.getItem('moi-theme')||'light';
    var mode=appearance;
    if(appearance==='system'){
      mode=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    }else if(appearance!=='dark'&&appearance!=='light'){
      mode='light';
    }
    document.documentElement.setAttribute('data-theme',mode);
    document.documentElement.setAttribute('data-appearance',appearance);
  }catch(e){
    document.documentElement.setAttribute('data-accent','original');
    document.documentElement.setAttribute('data-theme','light');
    document.documentElement.setAttribute('data-appearance','light');
  }
})();
</script>
